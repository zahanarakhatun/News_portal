{% extends 'master/base.html' %}
{% block content %}
<h2>{{ news.title }}</h2>
<p class="text-muted">By {{ news.author }} on {{ news.published_date }}</p>
{% if news.thumbnail %}<img src="{{ news.thumbnail.url }}" class="img-fluid mb-3">{% endif %}
<p>{{ news.content|linebreaks }}</p>
{% if user == news.author %}
  <a href="{% url 'news_update' news.pk %}" class="btn btn-warning">Edit</a>
  <a href="{% url 'news_delete' news.pk %}" class="btn btn-danger">Delete</a>
{% endif %}
<a href="{% url 'home' %}" class="btn btn-secondary">Back</a>
{% endblock %}
